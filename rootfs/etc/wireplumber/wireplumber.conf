# WirePlumber headless/container configuration override.
#
# In a Docker container there is no logind/seatd, so the
# monitor.bluez.seat-monitoring component fails to load and spams warnings.
# This override disables it explicitly and configures WirePlumber to manage
# Bluetooth audio without requiring a graphical session or seat.
#
# It also sets the Bluetooth policy to automatically switch connected
# devices to the A2DP sink profile, so the bluez_sink node is created as
# soon as a device connects — without needing a manual set-card-profile call.

wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
    support.logind = disabled
  }
}

wireplumber.components = [
  {
    name = monitor.bluez.seat-monitoring
    type = virtual
    deps = []
  }
]

monitor.bluez.properties = {
  bluez5.enable-hfphfp = false
  bluez5.default.profile = "a2dp_sink"
}

monitor.bluez.rules = {
  matches = [
    { device.name = "~bluez_card.*" }
  ]
  actions = {
    update-props = {
      device.profile = "a2dp_sink"
      bluez5.auto-switch-profile = true
    }
  }
}
