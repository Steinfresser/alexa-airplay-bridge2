# WirePlumber drop-in for headless/container environments.
# Disables logind-based seat monitoring (unavailable in containers)
# and configures Bluetooth to default to A2DP sink profile.

wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
    support.logind = disabled
  }
}

monitor.bluez.properties = {
  bluez5.enable-hfphfp = false
}
