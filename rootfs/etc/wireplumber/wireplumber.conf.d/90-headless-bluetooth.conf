# WirePlumber drop-in for headless/container environments.
# Disables logind-based seat monitoring (unavailable in containers)
# and configures Bluetooth to default to A2DP sink profile.
#
# CRITICAL: Prevents WirePlumber from suspending idle Bluetooth sinks.
# Without this, A2DP sinks are removed after a few seconds of inactivity,
# which causes audio to route to auto_null (silence).

wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
    support.logind = disabled
  }
}

monitor.bluez.properties = {
  bluez5.enable-hfphfp = false
}

# Keep Bluetooth A2DP sinks alive — never suspend or pause on idle.
# WirePlumber removes idle BT nodes after a short timeout, which is fatal
# in this headless bridge: shairport-sync needs the sink to exist before
# any AirPlay audio arrives.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
      { node.name = "~bluez_sink.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        node.suspend-on-idle = false
      }
    }
  }
]
